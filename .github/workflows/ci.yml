# Author: Erik Bitzek <e.bitzek@mpi-susmat.de>
# Max-Planck-Institut for Sustainable Materials, Duesseldorf, Germany /
# Institute of Materials Simulation (WW8), FAU Erlangen-Nuernberg, Fuerth, Germany
# Funded by DFG -- NFDI 38/1, project 460247524 (NFDI-MatWerk).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  packaging:
    # Builds a wheel and tests it the way a user gets it: installed, with the
    # source tree nowhere on the path. Guards the 0.3.1 bug where presets/ and
    # schema/ were not package data, so `extends:` failed and `ovzm schema`
    # printed null.
    name: wheel install (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Assert package data is in the wheel
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          required = [
              "ovzm/schema/vizcard.schema.json",
              "ovzm/presets/dxa-standard.yaml",
              "ovzm/presets/segregation-map.yaml",
          ]
          missing = [r for r in required if r not in names]
          if missing:
              sys.exit("missing from wheel: " + ", ".join(missing))
          print("wheel ships all package data")
          PY

      - name: Install the wheel (without the heavy ovito dep)
        run: |
          python -m pip install --no-deps dist/*.whl
          python -m pip install pyyaml jsonschema pytest

      - name: Run tests from a scratch dir, source tree absent
        run: |
          mkdir -p /tmp/scratch && cd /tmp/scratch
          python -m pytest "$GITHUB_WORKSPACE/tests" -q

      - name: CLI smoke test
        run: |
          mkdir -p /tmp/cli && cd /tmp/cli
          ovzm schema | head -3
          printf 'name: ci\nextends: dxa-standard\ninput: {file: nope.dump}\nmeta: {creator: CI}\n' > c.yaml
          ovzm validate c.yaml
          printf 'name: bad\ninput: {file: n.dump}\nview: {direction: nonsense-!!}\n' > bad.yaml
          if ovzm validate bad.yaml; then echo "ERROR: invalid card was accepted"; exit 1; fi
          echo "invalid card correctly rejected"

  render:
    # End-to-end: real ovito, real DXA, real Tachyon render on a generated
    # structure. No research data involved.
    name: render smoke (ovito)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: GL runtime for the ovito module
        run: sudo apt-get update && sudo apt-get install -y libopengl0 libegl1 libgl1 libglx0 libxkbcommon0
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install .
      - name: Render a generated fcc block
        run: |
          mkdir -p /tmp/render && cd /tmp/render
          python "$GITHUB_WORKSPACE/tests/make_fcc.py" fcc.data
          ovzm info fcc.data
          printf 'name: ci-smoke\nextends: dxa-standard\ninput: {file: fcc.data}\ncrystal: {x: [1,0,0], y: [0,1,0], z: [0,0,1], lattice: fcc}\natoms: {names: {1: Ni}}\nmeta: {creator: CI}\n' > c.yaml
          ovzm render c.yaml -o dxa.png
          # a perfect crystal has no non-fcc atoms, so the dxa-standard view is
          # legitimately empty; render a second card with atoms visible and
          # assert the image is not blank, or a broken renderer would pass.
          printf 'name: ci-atoms\nextends: dxa-standard\ninput: {file: fcc.data}\ncrystal: {x: [1,0,0], y: [0,1,0], z: [0,0,1], lattice: fcc}\natoms: {show: all, names: {1: Ni}}\nmeta: {creator: CI}\n' > atoms.yaml
          ovzm render atoms.yaml -o atoms.png
          test -s dxa.png && test -s dxa.png.prov.yaml
          test -s atoms.png && test -s atoms.png.prov.yaml
          python -m pip install pillow numpy
          python - <<'PY'
          from PIL import Image
          import numpy as np, sys
          a = np.asarray(Image.open("atoms.png").convert("RGB")).reshape(-1, 3)
          frac = float((a.max(1) < 250).mean())
          print(f"non-white pixel fraction: {frac:.4f}")
          if frac < 0.05:
              sys.exit("render produced a (near-)blank image")
          PY
          ovzm prov atoms.png | head -5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-smoke
          path: /tmp/render/*
