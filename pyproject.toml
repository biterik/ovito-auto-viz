[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ovito-auto-viz"
version = "0.4.0"
description = "Declarative, reproducible OVITO visualization of LAMMPS files: YAML viz-cards -> images, movies, or ready-to-open OVITO sessions."
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Erik Bitzek", email = "e.bitzek@mpi-susmat.de" }]
requires-python = ">=3.9"
dependencies = [
    "ovito>=3.12",
    "PyYAML>=6.0",
    "jsonschema>=4.0",
    "numpy",
]

[project.scripts]
ovzm = "ovzm.cli:main"

[project.urls]
Homepage = "https://github.com/biterik/ovito-auto-viz"
Repository = "https://github.com/biterik/ovito-auto-viz"

[tool.setuptools.packages.find]
where = ["src"]

# Presets and the card schema are package data (src/ovzm/presets,
# src/ovzm/schema) so that a plain `pip install` yields a working CLI.
[tool.setuptools.package-data]
ovzm = ["presets/*.yaml", "schema/*.json"]
